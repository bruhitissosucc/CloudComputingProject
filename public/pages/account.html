<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account • Cloud Gallery</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body class="gallery-page">
    <div class="page-shell">
        <header class="page-header">
            <nav class="top-nav">
                <a class="brand" href="index.html">
                    <span class="brand-mark">☁</span>
                    <span>Cloud Gallery</span>
                </a>
                <div class="nav-actions" id="navActions">
                    <a href="login.html" class="nav-link">Login</a>
                    <a href="register.html" class="nav-link nav-link-cta">Register</a>
                </div>
            </nav>
        </header>

        <main class="gallery-section">
            <div class="section-heading">
                <div>
                    <h2>My account</h2>
                    <p>Upload, rename, and delete your own images here.</p>
                </div>
            </div>

            <div class="upload-panel">
                <div class="upload-zone">
                    <label for="fileInput" class="file-select-btn" id="fileLabel">Choose an image...</label>
                    <input type="file" id="fileInput" accept="image/png, image/jpeg, image/jpg, image/webp" onchange="updateFileName()">
                    <input type="text" id="imageTitleInput" class="account-title-input" placeholder="Optional title" aria-label="Image title">
                    <button class="upload-btn" id="uploadBtn" onclick="uploadImage()">Upload</button>
                </div>
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <p id="statusMsg" class="status-message">Supports JPG, PNG, WEBP · max 5MB</p>
            </div>

            <div class="gallery-container" id="accountGallery"></div>
        </main>
    </div>

    <div id="lightboxModal" class="lightbox-modal" onclick="closeLightboxModal(event)">
        <button class="close-lightbox" onclick="forceCloseLightbox()">&times;</button>
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <div class="lightbox-img-wrapper">
                <img id="lightboxImg" src="" alt="">
            </div>
            <div class="lightbox-details">
                <div id="lightboxTitle" class="lightbox-title">Image Name</div>
                <div class="lightbox-actions">
                    <a id="downloadLink" href="" download class="action-btn btn-download">Download</a>
                    <button id="copyCdnBtn" class="action-btn btn-copy-cdn">Copy Link</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
</body>
</html>
