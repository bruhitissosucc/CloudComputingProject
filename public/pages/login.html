<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Cloud Gallery</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <h2>Login</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="Username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Password">
            </div>
            <button type="submit" class="upload-btn auth-submit-btn">Login</button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="register.html">Sign up</a></p>
        <p class="auth-switch"><a href="index.html">← Back to Gallery</a></p>
    </div>
    <script src="../js/app.js"></script>
</body>
</html>
