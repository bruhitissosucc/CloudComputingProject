<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Cloud Gallery</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <h2>Create Account</h2>
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="regUsername">Username</label>
                <input type="text" id="regUsername" required placeholder="At least 3 characters...">
            </div>
            <div class="form-group">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" required placeholder="At least 6 characters...">
            </div>
            
            <button type="submit" class="upload-btn auth-submit-btn">Complete Registration</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>
    </div>
    <script src="../js/app.js"></script>
</body>
</html>
